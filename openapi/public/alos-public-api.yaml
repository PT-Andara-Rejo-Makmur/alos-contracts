      - {name: entity_type, in: path, required: true, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ChecklistEntityType}}
      - {name: entity_id, in: path, required: true, schema: {type: string}}
      - {name: item_id, in: path, required: true, schema: {type: string}}
    post:
      operationId: completeSharedWorkChecklistItem
      description: Requires work.checklist.manage; repeated completion is idempotent.
      responses:
        "200": {description: Completed item, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ChecklistItemProjection}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/work/{entity_type}/{entity_id}/evidence:
    parameters:

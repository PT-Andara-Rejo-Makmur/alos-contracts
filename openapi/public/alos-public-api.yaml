  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate one account and create a revocable Backend session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 8, maxLength: 256}
      responses:
        "200":
          description: Opaque bearer session and canonical principal projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, token_type, principal]
                properties:
                  access_token: {type: string, minLength: 32}
                  token_type: {const: bearer}
                  principal:
                    $ref: ../../schemas/identity/authenticated-principal-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      summary: Request password reset email for an existing account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/password-reset-request.schema.json
      responses:
        "200":
          description: Generic confirmation message to prevent enumeration
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/password-reset-response.schema.json
        "429": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Reset account password using a one-time challenge token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/password-reset-confirm-request.schema.json
      responses:
        "200":
          description: Password reset confirmation
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/password-reset-confirm-response.schema.json
        "422": {$ref: "#/components/responses/ErrorResponse"}
        "429": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/whoami:
    get:
      operationId: whoami
      summary: Return the canonical principal and current active-workspace context
      responses:
        "200":
          description: Canonical authenticated principal
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/authenticated-principal-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/accounts:
    get:
      operationId: listIdentityAccounts
      summary: List account projections within the caller organization
      description: >-
        Requires `identity.accounts.manage` and the active IT_ADMIN policy guard.
        Results are restricted to the authenticated tenant and organization.
      responses:
        "200":
          description: Organization-bounded identity account projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/identity-account-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: provisionIdentityAccount
      summary: Provision an account and initial membership under Backend authorization
      description: >-
        Requires the canonical `identity.accounts.manage` permission. Tenant and
        organization are always derived from the authenticated principal; the
        supplied workspace must already belong to that active authority boundary.
        Account email is derived exclusively from the eligible HR Employee record;
        client email fields are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/provision-account-request.schema.json
      responses:
        "201":
          description: Provisioned employee account and initial authoritative workspace access
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/identity-account-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/assignable-roles:
    get:
      operationId: listAssignableIdentityRoles
      summary: List canonical roles assignable by identity administrators
      description: >-
        Requires `identity.accounts.manage` and the active IT_ADMIN policy guard.
      responses:
        "200":
          description: Canonical authorization roles
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: ../../schemas/identity/authorization-vocabulary.schema.json#/$defs/authorization_role
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/provisioning-candidates:
    get:
      operationId: listIdentityProvisioningCandidates
      summary: List eligible unlinked employees within the caller organization
      description: >-
        Backend filters employee status, actor linkage, tenant, organization, and
        employment dates. The projection contains only minimum identity facts.
      responses:
        "200":
          description: Organization-bounded employee provisioning candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/provisioning-candidate-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/workspaces:
    get:
      operationId: listIdentityWorkspaceCatalog
      summary: List active workspace facts within the caller organization
      description: >-
        Organization workspace catalog for identity administration. Items are
        workspace facts, not user memberships, and require `identity.accounts.manage`
        plus the active IT_ADMIN policy guard.
      responses:
        "200":
          description: Active organization workspace catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/workspace-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/access:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    get:
      operationId: listIdentityAccountAccess
      summary: List authoritative workspace memberships for an actor in the caller organization
      responses:
        "200":
          description: Active and revoked workspace-access projections
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/memberships:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: assignIdentityMembership
      summary: Assign an existing actor to an existing workspace in the caller organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/membership-mutation-request.schema.json
      responses:
        "201":
          description: Assigned membership
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
    put:
      operationId: updateIdentityMembership
      summary: Replace authority facts on an active workspace membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/membership-mutation-request.schema.json
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/memberships/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/ActorId"
      - $ref: "#/components/parameters/WorkspaceId"
    delete:
      operationId: revokeIdentityMembership
      summary: Revoke one actor workspace membership
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: [string, "null"], maxLength: 2000}
      responses:
        "204": {description: Membership revoked}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: activateIdentityAccount
      summary: Activate an account and actor without restoring revoked sessions
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-state-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: suspendIdentityAccount
      summary: Suspend an account and actor and revoke all current sessions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: [string, "null"], maxLength: 2000}
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-state-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/activation/resend:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: resendActivationInvitation
      summary: Invalidate pending activation challenge and issue a new 24-hour invitation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/resend-activation-request.schema.json
      responses:
        "200":
          description: Resend activation status
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/resend-activation-response.schema.json
        "400": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "429": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    get:
      operationId: listIdentityAccountSessions
      summary: List safe session metadata for an account
      responses:
        "200":
          description: Session IDs, timestamps, workspace, and revocation state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/admin-session-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/ActorId"
      - name: session_id
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
    delete:
      operationId: revokeIdentityAccountSession
      summary: Revoke one account session within the caller organization
      responses:
        "204": {description: Session revoked}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/history:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    get:
      operationId: listIdentityAccountHistory
      summary: List safe identity audit event summaries for an account
      responses:
        "200":
          description: Append-only identity audit event summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/identity-audit-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/activate:
    post:
      operationId: activateEmployeeAccount
      summary: Activate a pending employee account using a one-time challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/activate-account-request.schema.json
      responses:
        "200":
          description: Account activated
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/activate-account-response.schema.json
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current Backend session
      responses:

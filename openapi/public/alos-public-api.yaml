    get:
      operationId: getStrategyAuthority
      summary: Get Backend-authorized collection actions for the active principal and workspace
      responses:
        "200": {description: Fail-closed strategy collection authority, content: {application/json: {schema: {$ref: ../../schemas/strategy/strategy-authority-projection.schema.json}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/strategy/plans/{plan_id}:
    get:
      operationId: getStrategyPlan
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "200": {description: Exact plan version projection, content: {application/json: {schema: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    patch:
      operationId: updateDraftStrategyPlan
      summary: Update mutable fields on a DRAFT strategy plan
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../schemas/strategy/strategy-plan-update-request.schema.json}
      responses:
        "200": {description: Updated DRAFT plan, content: {application/json: {schema: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}

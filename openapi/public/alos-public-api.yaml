          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id]
              properties:
                workspace_id:
                  $ref: ../../schemas/common/identifiers.schema.json#/$defs/workspace_id
      responses:
        "200":
          description: Validated active workspace
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/active-workspace-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/workspaces:
    get:
      operationId: listAuthorizedWorkspaces
      summary: List only active workspaces authorized by active membership
      responses:
        "200":
          description: Backend-authorized workspace access projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/skills:
    get:
      operationId: listSkills
      summary: List Backend-authorized active skill versions
      responses:
        "200":
          description: Authorized skill projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-list-response.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: getSkillDetail
      summary: Get an authorized skill detail
      responses:
        "200":
          description: Exact skill detail
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-detail.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}/versions:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: listSkillVersions

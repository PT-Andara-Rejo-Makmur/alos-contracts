                  run_id:
                    $ref: ../../schemas/common/identifiers.schema.json#/$defs/run_id
                  status: {type: string, enum: [CANCEL_REQUESTED, CANCELLED]}
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/reviews:
    post:
      operationId: requestAdvisoryReview
      summary: Request a non-authoritative GENESIS review through Backend authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/review/review-invocation.schema.json

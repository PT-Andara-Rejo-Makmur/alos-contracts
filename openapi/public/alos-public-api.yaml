      - {name: entity_id, in: path, required: true, schema: {type: string}}
    get:
      operationId: listSharedWorkEvidence
      responses:
        "200": {description: Linked evidence references, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/EvidenceProjection}}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: linkSharedWorkEvidence
      description: Requires work.evidence.link and a visible verified EvidenceRef.
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/EvidenceLinkRequest}}}}
      responses:
        "201": {description: Linked evidence, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/EvidenceProjection}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}

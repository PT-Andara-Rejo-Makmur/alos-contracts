openapi: 3.1.0
info:
  title: ALOS Public API
  version: 1.5.0
  description: >-
    The public contract exposed by the authoritative ALOS Backend. ARA, GIIVEPRO,
    and other frontend clients use this API and never call GENESIS directly.
servers:
  - url: https://api.example.com
    description: Placeholder; consumers supply the environment URL.
security:
  - bearerAuth: []
paths:
  /api/v1/skills:
    get:
      operationId: listSkills
      summary: List Backend-authorized active skill versions
      responses:
        "200":
          description: Authorized skill projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-list-response.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: getSkillDetail
      summary: Get an authorized skill detail
      responses:
        "200":
          description: Exact skill detail
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-detail.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}/versions:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: listSkillVersions
      summary: List skill versions visible in the authority context
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-version-list.schema.json
  /api/v1/agents/{agent_id}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSkills
      summary: Project canonical skill refs from an AgentDefinition
      responses:
        "200":
          description: Agent skill projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/agent-skill-projection.schema.json
    post:
      operationId: assignAgentSkill
      summary: Propose a new immutable AgentDefinition DRAFT with an exact skill ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/skill/agent-skill-assignment-request.schema.json
      responses:
        "201":
          description: New AgentDefinition DRAFT receipt; no approval or activation occurred
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/agent-skill-assignment-receipt.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/genesis/context-options:
    get:
      operationId: getActiveContextProjection
      summary: Get the Backend-authoritative active-context projection
      description: >-
        Returns only context state safe for frontend projection. Missing scope fails
        closed and raw permission or tool authorization snapshots are never exposed.
      responses:
        "200":
          description: Current context lifecycle projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/context/context-projection.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/research/domain-access:
    get:
      operationId: getResearchDomainAccess
      summary: Get Backend-calculated access for all canonical research domains
      responses:
        "200":
          description: Domain access projection; the client must not recalculate authority
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/domain-access-response.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/research/requests:
    post:
      operationId: requestResearchDecision
      summary: Request a Backend-governed GENESIS research-source decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/research/public-research-request.schema.json
      responses:
        "200":
          description: Safe receipt containing the traceable research decision
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/research-request-receipt.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/genesis/factory/analyze:
    post:
      operationId: analyzeFactoryRequirement
      summary: Resolve a business requirement through Backend-governed GENESIS Factory
      description: >-
        ALOS Backend derives authoritative identity, scope, permission context, and the
        capability catalog. The client cannot grant authority. CREATE results are returned
        only after Backend records the proposal as DRAFT; REUSE never creates a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/factory/factory-analyze-request.schema.json
      responses:
        "200":
          description: Existing capability reference or Backend-registered DRAFT
          content:
            application/json:
              schema:
                $ref: ../../schemas/factory/factory-analyze-response.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/system/integration:
    get:
      operationId: getIntegrationDiagnostic
      summary: Verify the governed Backend to GENESIS integration path
      security: []
      responses:
        "200":
          description: Backend and GENESIS are reachable through the governed boundary
          content:
            application/json:
              schema:
                $ref: ../../schemas/common/integration-diagnostic.schema.json
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/capabilities/{capability_id}:
    parameters:
      - $ref: "#/components/parameters/CapabilityId"
    get:
      operationId: getCapabilityDetail
      summary: Get the authoritative detail of a registered capability version
      description: >-
        Returns the Backend-owned CapabilityDetail projection: governance lifecycle,
        scope, permission, tool, risk, and approval lineage. No database or registry
        storage detail is exposed. A DRAFT is visible only to its creator; other
        consumers only see authorized ACTIVE versions. All other lifecycle states
        fail closed as not found.
      responses:
        "200":
          description: Authorized capability detail projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/capability/capability-detail.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /v1/agent-runs:
    post:
      operationId: createAgentRun
      summary: Request an agent run through ALOS Backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/agent/agent-run-request.schema.json
      responses:
        "202":
          description: Run accepted
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    $ref: ../../schemas/common/identifiers.schema.json#/$defs/run_id
                  status:
                    const: QUEUED
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /v1/agent-runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getAgentRun
      summary: Get an agent run result
      responses:
        "200":
          description: Current or terminal run result
          content:
            application/json:
              schema:
                $ref: ../../schemas/agent/agent-run-result.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /v1/review-packages/{review_id}:
    parameters:
      - name: review_id
        in: path
        required: true
        schema:
          $ref: ../../schemas/common/identifiers.schema.json#/$defs/review_id
    get:
      operationId: getReviewPackage
      summary: Get an assurance package and any authoritative decisions
      responses:
        "200":
          description: Review package
          content:
            application/json:
              schema:
                $ref: ../../schemas/review/review-package.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: ../../schemas/common/identifiers.schema.json#/$defs/run_id
    CapabilityId:
      name: capability_id
      in: path
      required: true
      schema:
        $ref: ../../schemas/common/identifiers.schema.json#/$defs/capability_id
    SkillId:
      name: skill_id
      in: path
      required: true
      schema:
        $ref: ../../schemas/common/identifiers.schema.json#/$defs/skill_id
    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        $ref: ../../schemas/common/identifiers.schema.json#/$defs/agent_id
  responses:
    ErrorResponse:
      description: Contract error
      content:
        application/json:
          schema:
            $ref: ../../schemas/common/error.schema.json

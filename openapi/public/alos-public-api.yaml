openapi: 3.1.0
info:
  title: ALOS Public API
  version: 2.0.0
  description: >-
    The public contract exposed by the authoritative ALOS Backend. ARA, GIIVEPRO,
    and other frontend clients use this API and never call GENESIS directly.
servers:
  - url: https://api.example.com
    description: Placeholder; consumers supply the environment URL.
security:
  - bearerAuth: []
paths:
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: List documents in the authenticated active workspace
      description: Requires document.read or legacy work.read.
      parameters:
        - {name: status, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentStatus}}
        - {name: classification, in: query, schema: {$ref: ../../schemas/common/data-classification.schema.json}}
        - {name: category, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200": {description: Visible documents, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createDocument
      summary: Create document metadata in the authenticated active workspace
      description: Requires document.create or legacy work.write. Backend assigns scope, owner and DRAFT status.
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentCreateRequest}}}}
      responses:
        "201": {description: Created document, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}:
    get:
      operationId: getDocument
      summary: Get a document in the authenticated active workspace
      description: Requires document.read or legacy work.read.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Visible document, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}/versions:
    get:
      operationId: listDocumentVersions
      summary: List immutable versions of a visible document
      description: Requires document.read or legacy work.read.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Document versions, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentVersionProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createDocumentVersion
      summary: Register an immutable reference to a scoped authoritative source version
      description: Requires document.version. Backend copies URI and content hash from the source version.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentVersionCreateRequest}}}}
      responses:
        "201": {description: Created document version, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentVersionProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}/source-options:
    get:
      operationId: listDocumentSourceOptions
      summary: List verified source versions eligible for a visible draft document
      description: Requires document.version. Storage URI and internal credentials are not exposed.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Eligible source versions, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentSourceOptionProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}/review:
    post:
      operationId: reviewDocument
      summary: Transition a draft document to review state
      description: Requires document.review. Document must be in DRAFT state and have at least one authoritative version. Repeating the action is idempotent.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Document in review, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}/approve:
    post:
      operationId: approveDocument
      summary: Approve a document in review as a different actor
      description: Requires document.approve. Document must be in IN_REVIEW state, have at least one immutable version, and caller cannot be document owner. Repeating the identical action is idempotent.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Approved document, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/documents/{document_id}/retire:
    post:
      operationId: retireDocument
      summary: Retire an approved document
      description: Requires document.retire. Document must be in APPROVED state. Repeating the action is idempotent.
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Retired document, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/DocumentProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals:
    get:
      operationId: listApprovals
      summary: List approvals visible in the authenticated active workspace
      description: Requires approval.read or legacy work.read.
      parameters:
        - {name: status, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalStatus}}
        - {name: subject_type, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalSubjectType}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200": {description: Visible approvals, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: requestApproval
      summary: Request approval for a visible Project or Task
      description: Requires approval.request or legacy work.write. Backend establishes scope and requester.
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalRequest}}}}
      responses:
        "201": {description: Pending approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals/{approval_id}:
    get:
      operationId: getApproval
      summary: Get a workspace-visible approval
      description: Requires approval.read or legacy work.read.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Visible approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals/{approval_id}/approve:
    post:
      operationId: approveApproval
      summary: Approve a pending approval as a different actor
      description: Requires approval.approve. Repeating the identical decision is idempotent.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalDecisionRequest}}}}
      responses:
        "200": {description: Approved approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals/{approval_id}/return:
    post:
      operationId: returnApproval
      summary: Return a pending approval as a different actor
      description: Requires approval.return and a non-empty decision reason.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalDecisionRequest}}}}
      responses:
        "200": {description: Returned approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals/{approval_id}/reject:
    post:
      operationId: rejectApproval
      summary: Reject a pending approval as a different actor
      description: Requires approval.reject and a non-empty decision reason.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalDecisionRequest}}}}
      responses:
        "200": {description: Rejected approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/approvals/{approval_id}/hold:
    post:
      operationId: holdApproval
      summary: Hold a pending approval as a different actor
      description: Requires approval.hold and a non-empty decision reason.
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalDecisionRequest}}}}
      responses:
        "200": {description: Held approval, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ApprovalProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/workspace-members:
    get:
      operationId: listSharedWorkWorkspaceMembers
      summary: List active members of the authenticated active workspace
      description: Read-only directory for Shared Work presentation and assignment. Requires a Shared Work read or assign permission.
      responses:
        "200": {description: Eligible workspace members, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/WorkspaceMemberProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List projects visible in the authenticated active workspace
      description: Requires project.read or legacy work.read within the same active workspace.
      parameters:
        - {name: status, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectStatus}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200": {description: Visible projects, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createProject
      summary: Create a project in the authenticated active workspace
      description: Requires project.create or legacy work.write. Backend assigns identifiers, scope, and lifecycle state.
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectCreateRequest}}}}
      responses:
        "201": {description: Created project, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      summary: Get a project visible in the authenticated active workspace
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200": {description: Visible project, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    patch:
      operationId: updateProject
      summary: Update mutable project fields in the active workspace
      description: Requires project.update or legacy work.write. Lifecycle and authority fields are rejected.
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectUpdateRequest}}}}
      responses:
        "200": {description: Updated project, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/projects/{project_id}/relations:
    get:
      operationId: listProjectRelations
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200": {description: Scoped project relations, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/RelationProjection}}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/projects/{project_id}/archive:
    post:
      operationId: archiveProject
      summary: Archive a project through its authorized lifecycle operation
      description: Requires project.archive. Repeating the operation on an archived project returns its current projection.
      parameters: [{$ref: "#/components/parameters/ProjectId"}]
      responses:
        "200": {description: Archived project, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ProjectProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks visible in the authenticated active workspace
      description: Requires task.read or legacy work.read within the same active workspace.
      parameters:
        - {name: status, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskStatus}}
        - {name: priority, in: query, schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskPriority}}
        - {name: search, in: query, schema: {type: string}}
      responses:
        "200": {description: Visible tasks, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createTask
      summary: Create a task in the authenticated active workspace
      description: Requires task.create or legacy work.write. A supplied project must be visible in this workspace.
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskCreateRequest}}}}
      responses:
        "201": {description: Created task, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Get a task visible in the authenticated active workspace
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      responses:
        "200": {description: Visible task, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    patch:
      operationId: updateTask
      summary: Update mutable task fields in the active workspace
      description: Requires task.update or legacy work.write. Assignment and lifecycle fields are rejected.
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskUpdateRequest}}}}
      responses:
        "200": {description: Updated task, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/tasks/{task_id}/assign:
    post:
      operationId: assignTask
      summary: Assign a task to an eligible actor in the active workspace
      description: Requires task.assign. Backend validates active actor and membership authority.
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskAssignRequest}}}}
      responses:
        "200": {description: Assigned task, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/tasks/{task_id}/complete:
    post:
      operationId: completeTask
      summary: Complete a task through its authorized lifecycle operation
      description: Requires task.complete. Repeating the operation on a completed task returns its current projection.
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      responses:
        "200": {description: Completed task, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
  /api/v1/tasks/{task_id}/dependencies:
    post:
      operationId: addTaskDependency
      description: Requires task.update. Both tasks must be visible in the active workspace; cycles are rejected.
      parameters: [{$ref: "#/components/parameters/TaskId"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskDependencyRequest}}}}
      responses:
        "200": {description: Task with authoritative dependencies, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/tasks/{task_id}/dependencies/{blocked_by_task_id}:
    delete:
      operationId: removeTaskDependency
      description: Requires task.update; removing an absent link is idempotent.
      parameters:
        - {$ref: "#/components/parameters/TaskId"}
        - {name: blocked_by_task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: Task with authoritative dependencies, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/TaskProjection}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/work/reports/definitions:
    get:
      operationId: listReportDefinitions
      summary: List definitions in the authenticated active workspace
      responses:
        "200": {description: Visible definitions, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionProjection}}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createReportDefinition
      summary: Create an owned report definition
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionCreateRequest}}}}
      responses:
        "201": {description: Created definition, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/work/reports/definitions/{definition_id}:
    get:
      operationId: getReportDefinition
      parameters: [{name: definition_id, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: Visible definition, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    patch:
      operationId: updateReportDefinition
      summary: Update owned definition configuration
      parameters: [{name: definition_id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionUpdateRequest}}}}
      responses:
        "200": {description: Updated definition, content: {application/json: {schema: {$ref: ../../schemas/shared-work/shared-work.schema.json#/$defs/ReportDefinitionProjection}}}}
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/work/reports/results:
    get:
      operationId: listReportResults
      summary: List report results in the authenticated active workspace

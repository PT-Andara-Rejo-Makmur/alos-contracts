openapi: 3.1.0
info:
  title: ALOS Public API
  version: 1.10.0
  description: >-
    The public contract exposed by the authoritative ALOS Backend. ARA, GIIVEPRO,
    and other frontend clients use this API and never call GENESIS directly.
servers:
  - url: https://api.example.com
    description: Placeholder; consumers supply the environment URL.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate one account and create a revocable Backend session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 8, maxLength: 256}
      responses:
        "200":
          description: Opaque bearer session and canonical principal projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, token_type, principal]
                properties:
                  access_token: {type: string, minLength: 32}
                  token_type: {const: bearer}
                  principal:
                    $ref: ../../schemas/identity/authenticated-principal-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/whoami:
    get:
      operationId: whoami
      summary: Return the canonical principal and current active-workspace context
      responses:
        "200":
          description: Canonical authenticated principal
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/authenticated-principal-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/accounts:
    get:
      operationId: listIdentityAccounts
      summary: List account projections within the caller organization
      description: >-
        Requires `identity.accounts.manage` and the active IT_ADMIN policy guard.
        Results are restricted to the authenticated tenant and organization.
      responses:
        "200":
          description: Organization-bounded identity account projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/identity-account-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: provisionIdentityAccount
      summary: Provision an account and initial membership under Backend authorization
      description: >-
        Requires the canonical `identity.accounts.manage` permission. Tenant and
        organization are always derived from the authenticated principal; the
        supplied workspace must already belong to that active authority boundary.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/provision-account-request.schema.json
      responses:
        "201":
          description: Provisioned actor and initial authoritative workspace access
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [actor, email, workspace_access]
                properties:
                  actor:
                    $ref: ../../schemas/identity/actor-projection.schema.json
                  email: {type: string, format: email, maxLength: 255}
                  workspace_access:
                    type: array
                    items:
                      $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
        "422": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/assignable-roles:
    get:
      operationId: listAssignableIdentityRoles
      summary: List canonical roles assignable by identity administrators
      description: >-
        Requires `identity.accounts.manage` and the active IT_ADMIN policy guard.
      responses:
        "200":
          description: Canonical authorization roles
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items:
                  $ref: ../../schemas/identity/authorization-vocabulary.schema.json#/$defs/authorization_role
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/workspaces:
    get:
      operationId: listIdentityWorkspaceCatalog
      summary: List active workspace facts within the caller organization
      description: >-
        Organization workspace catalog for identity administration. Items are
        workspace facts, not user memberships, and require `identity.accounts.manage`
        plus the active IT_ADMIN policy guard.
      responses:
        "200":
          description: Active organization workspace catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/workspace-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/access:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    get:
      operationId: listIdentityAccountAccess
      summary: List authoritative workspace memberships for an actor in the caller organization
      responses:
        "200":
          description: Active and revoked workspace-access projections
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/memberships:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: assignIdentityMembership
      summary: Assign an existing actor to an existing workspace in the caller organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/membership-mutation-request.schema.json
      responses:
        "201":
          description: Assigned membership
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
    put:
      operationId: updateIdentityMembership
      summary: Replace authority facts on an active workspace membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/identity/membership-mutation-request.schema.json
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/memberships/{workspace_id}:
    parameters:
      - $ref: "#/components/parameters/ActorId"
      - $ref: "#/components/parameters/WorkspaceId"
    delete:
      operationId: revokeIdentityMembership
      summary: Revoke one actor workspace membership
      responses:
        "204": {description: Membership revoked}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/activate:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: activateIdentityAccount
      summary: Activate an account and actor without restoring revoked sessions
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-state-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/identity/actors/{actor_id}/suspend:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    post:
      operationId: suspendIdentityAccount
      summary: Suspend an account and actor and revoke all current sessions
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/account-state-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current Backend session
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/auth/active-workspace:
    put:
      operationId: selectActiveWorkspace
      summary: Select a workspace after Backend validates active membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workspace_id]
              properties:
                workspace_id:
                  $ref: ../../schemas/common/identifiers.schema.json#/$defs/workspace_id
      responses:
        "200":
          description: Validated active workspace
          content:
            application/json:
              schema:
                $ref: ../../schemas/identity/active-workspace-projection.schema.json
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/workspaces:
    get:
      operationId: listAuthorizedWorkspaces
      summary: List only active workspaces authorized by active membership
      responses:
        "200":
          description: Backend-authorized workspace access projections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../../schemas/identity/workspace-access-projection.schema.json
        "401": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/skills:
    get:
      operationId: listSkills
      summary: List Backend-authorized active skill versions
      responses:
        "200":
          description: Authorized skill projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-list-response.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: getSkillDetail
      summary: Get an authorized skill detail
      responses:
        "200":
          description: Exact skill detail
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-detail.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{skill_id}/versions:
    parameters:
      - $ref: "#/components/parameters/SkillId"
    get:
      operationId: listSkillVersions
      summary: List skill versions visible in the authority context
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/skill-version-list.schema.json
  /api/v1/agents/{agent_id}/skills:
    parameters:
      - $ref: "#/components/parameters/AgentId"
    get:
      operationId: listAgentSkills
      summary: Project canonical skill refs from an AgentDefinition
      responses:
        "200":
          description: Agent skill projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/agent-skill-projection.schema.json
    post:
      operationId: assignAgentSkill
      summary: Propose a new immutable AgentDefinition DRAFT with an exact skill ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/skill/agent-skill-assignment-request.schema.json
      responses:
        "201":
          description: New AgentDefinition DRAFT receipt; no approval or activation occurred
          content:
            application/json:
              schema:
                $ref: ../../schemas/skill/agent-skill-assignment-receipt.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/genesis/context-options:
    get:
      operationId: getActiveContextProjection
      summary: Get the Backend-authoritative active-context projection
      description: >-
        Returns only context state safe for frontend projection. Missing scope fails
        closed and raw permission or tool authorization snapshots are never exposed.
      responses:
        "200":
          description: Current context lifecycle projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/context/context-projection.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/research/domain-access:
    get:
      operationId: getResearchDomainAccess
      summary: Get Backend-calculated access for all canonical research domains
      responses:
        "200":
          description: Domain access projection; the client must not recalculate authority
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/domain-access-response.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/research/requests:
    post:
      operationId: requestResearchDecision
      summary: Request a Backend-governed GENESIS research-source decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/research/public-research-request.schema.json
      responses:
        "200":
          description: Safe receipt containing the traceable research decision
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/research-request-receipt.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/genesis/factory/analyze:
    post:
      operationId: analyzeFactoryRequirement
      summary: Resolve a business requirement through Backend-governed GENESIS Factory
      description: >-
        ALOS Backend derives authoritative identity, scope, permission context, and the
        capability catalog. The client cannot grant authority. CREATE results are returned
        only after Backend records the proposal as DRAFT; REUSE never creates a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/factory/factory-analyze-request.schema.json
      responses:
        "200":
          description: Existing capability reference or Backend-registered DRAFT
          content:
            application/json:
              schema:
                $ref: ../../schemas/factory/factory-analyze-response.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/system/integration:
    get:
      operationId: getIntegrationDiagnostic
      summary: Verify the governed Backend to GENESIS integration path
      security: []
      responses:
        "200":
          description: Backend and GENESIS are reachable through the governed boundary
          content:
            application/json:
              schema:
                $ref: ../../schemas/common/integration-diagnostic.schema.json
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/capabilities/{capability_id}:
    parameters:
      - $ref: "#/components/parameters/CapabilityId"
    get:
      operationId: getCapabilityDetail
      summary: Get the authoritative detail of a registered capability version
      description: >-
        Returns the Backend-owned CapabilityDetail projection: governance lifecycle,
        scope, permission, tool, risk, and approval lineage. No database or registry
        storage detail is exposed. A DRAFT is visible only to its creator; other
        consumers only see authorized ACTIVE versions. All other lifecycle states
        fail closed as not found.
      responses:
        "200":
          description: Authorized capability detail projection
          content:
            application/json:
              schema:
                $ref: ../../schemas/capability/capability-detail.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/agent-runs:
    post:
      operationId: createAgentRun
      summary: Request an agent run through ALOS Backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/agent/agent-run-create-request.schema.json
      responses:
        "200":
          description: Terminal governed run result
          content:
            application/json:
              schema:
                $ref: ../../schemas/agent/agent-run-result.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/agent-runs/{run_id}/cancellation:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: cancelAgentRun
      summary: Request cancellation through Backend runtime authority
      responses:
        "200":
          description: Cancellation state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [run_id, status]
                properties:
                  run_id:
                    $ref: ../../schemas/common/identifiers.schema.json#/$defs/run_id
                  status: {type: string, enum: [CANCEL_REQUESTED, CANCELLED]}
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/reviews:
    post:
      operationId: requestAdvisoryReview
      summary: Request a non-authoritative GENESIS review through Backend authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/review/review-invocation.schema.json
      responses:
        "200":
          description: Evidence-linked advisory review package
          content:
            application/json:
              schema:
                allOf:
                  - $ref: ../../schemas/review/review-package.schema.json
                  - not:
                      anyOf:
                        - required: [it_decision]
                        - required: [director_decision]
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/strategy/plans:
    get:
      operationId: listStrategyPlans
      summary: List strategy plans within authoritative scope
      responses:
        "200": {description: Strategy plans, content: {application/json: {schema: {type: array, items: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
    post:
      operationId: createStrategyPlan
      summary: Create a DRAFT strategy plan
      requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/strategy-plan-create-request.schema.json}}}}
      responses:
        "201": {description: Created plan, content: {application/json: {schema: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/strategy/authority:
    get:
      operationId: getStrategyAuthority
      summary: Get Backend-authorized collection actions for the active principal and workspace
      responses:
        "200": {description: Fail-closed strategy collection authority, content: {application/json: {schema: {$ref: ../../schemas/strategy/strategy-authority-projection.schema.json}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/strategy/plans/{plan_id}:
    get:
      operationId: getStrategyPlan
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      responses:
        "200": {description: Exact plan version projection, content: {application/json: {schema: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "404": {$ref: "#/components/responses/ErrorResponse"}
    patch:
      operationId: updateDraftStrategyPlan
      summary: Update mutable fields on a DRAFT strategy plan
      parameters: [{$ref: "#/components/parameters/PlanId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1}
                description: {type: [string, "null"]}
                owner_role_ref: {type: string, minLength: 1}
                period: {$ref: ../../schemas/strategy/business-period.schema.json}
                materiality: {type: string, enum: [MATERIAL, NON_MATERIAL]}
                source_refs: {type: array, items: {type: string}, uniqueItems: true}
                evidence_refs: {type: array, items: {$ref: ../../schemas/common/identifiers.schema.json#/$defs/evidence_id}, uniqueItems: true}
      responses:
        "200": {description: Updated DRAFT plan, content: {application/json: {schema: {oneOf: [{$ref: ../../schemas/strategy/strategic-plan.schema.json}, {$ref: ../../schemas/strategy/operating-plan.schema.json}]}}}}
        "403": {$ref: "#/components/responses/ErrorResponse"}
        "409": {$ref: "#/components/responses/ErrorResponse"}
  /api/v1/strategy/objectives:
    get: {operationId: listStrategicObjectives, responses: {"200": {description: Objectives, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/strategic-objective.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createStrategicObjective, requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/strategic-objective-create-request.schema.json}}}}, responses: {"201": {description: Created objective, content: {application/json: {schema: {$ref: ../../schemas/strategy/strategic-objective.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/targets:
    get: {operationId: listBusinessTargets, responses: {"200": {description: Targets, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/business-target.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createBusinessTarget, requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/business-target-create-request.schema.json}}}}, responses: {"201": {description: Created target, content: {application/json: {schema: {$ref: ../../schemas/strategy/business-target.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/targets/{target_id}:
    get: {operationId: getBusinessTarget, parameters: [{$ref: "#/components/parameters/TargetId"}], responses: {"200": {description: Target detail, content: {application/json: {schema: {$ref: ../../schemas/strategy/business-target-detail.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "404": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/targets/{target_id}/observations:
    get: {operationId: listTargetObservations, parameters: [{$ref: "#/components/parameters/TargetId"}], responses: {"200": {description: Typed target observations, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/metric-observation.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createTargetObservation, parameters: [{$ref: "#/components/parameters/TargetId"}], requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/metric-observation-create-request.schema.json}}}}, responses: {"201": {description: Created observation, content: {application/json: {schema: {$ref: ../../schemas/strategy/metric-observation.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/targets/{target_id}/relationships:
    get: {operationId: listTargetRelationships, parameters: [{$ref: "#/components/parameters/TargetId"}], responses: {"200": {description: Relationships, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/target-relationship.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createTargetRelationship, parameters: [{$ref: "#/components/parameters/TargetId"}], requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/target-relationship-create-request.schema.json}}}}, responses: {"201": {description: Created relationship, content: {application/json: {schema: {$ref: ../../schemas/strategy/target-relationship.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/assumptions:
    get: {operationId: listPlanningAssumptions, responses: {"200": {description: Assumptions, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/planning-assumption.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createPlanningAssumption, requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/planning-assumption-create-request.schema.json}}}}, responses: {"201": {description: Created assumption, content: {application/json: {schema: {$ref: ../../schemas/strategy/planning-assumption.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/cascade/preview:
    post: {operationId: previewTargetCascade, requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/cascade-preview-request.schema.json}}}}, responses: {"200": {description: Immutable deterministic preview, content: {application/json: {schema: {$ref: ../../schemas/strategy/cascade-preview-response.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/cascade-runs/{cascade_run_id}:
    get: {operationId: getCascadeRun, parameters: [{$ref: "#/components/parameters/CascadeRunId"}], responses: {"200": {description: Cascade run, content: {application/json: {schema: {$ref: ../../schemas/strategy/cascade-run.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "404": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/cascade-runs/{cascade_run_id}/accept:
    post: {operationId: acceptCascadeAsDraft, parameters: [{$ref: "#/components/parameters/CascadeRunId"}], requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [derived_targets], properties: {derived_targets: {type: array, minItems: 1, items: {$ref: ../../schemas/strategy/business-target-create-request.schema.json}}}}}}}, responses: {"200": {description: "Accepted run; derived targets remain DRAFT", content: {application/json: {schema: {$ref: ../../schemas/strategy/cascade-run.schema.json}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/plans/{plan_id}/submit:
    post: {operationId: submitStrategyPlan, parameters: [{$ref: "#/components/parameters/PlanId"}], responses: {"200": {description: Plan under review}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/plans/{plan_id}/approve:
    post: {operationId: approveStrategyPlan, parameters: [{$ref: "#/components/parameters/PlanId"}], responses: {"200": {description: Approved immutable plan}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/plans/{plan_id}/activate:
    post: {operationId: activateStrategyPlan, parameters: [{$ref: "#/components/parameters/PlanId"}], responses: {"200": {description: Active operating baseline}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}
  /api/v1/strategy/targets/{target_id}/revisions:
    get: {operationId: listTargetRevisions, parameters: [{$ref: "#/components/parameters/TargetId"}], responses: {"200": {description: Version history, content: {application/json: {schema: {type: array, items: {$ref: ../../schemas/strategy/target-revision.schema.json}}}}}, "403": {$ref: "#/components/responses/ErrorResponse"}}}
    post: {operationId: createTargetRevision, parameters: [{$ref: "#/components/parameters/TargetId"}], requestBody: {required: true, content: {application/json: {schema: {$ref: ../../schemas/strategy/target-revision-create-request.schema.json}}}}, responses: {"201": {description: Revision and new DRAFT target version}, "403": {$ref: "#/components/responses/ErrorResponse"}, "409": {$ref: "#/components/responses/ErrorResponse"}}}

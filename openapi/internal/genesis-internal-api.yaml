openapi: 3.1.0
info:
  title: ALOS–GENESIS Internal API
  version: 1.6.0
  description: >-
    Internal service contract between authoritative ALOS Backend and the GENESIS
    AI Control Plane. It does not grant GENESIS business authority or direct
    database access. All model calls remain behind ModelGateway and all business
    actions return through Backend ToolExecutor.
servers:
  - url: https://genesis.internal.example.com
    description: Placeholder internal endpoint.
security:
  - serviceAuth: []
paths:
  /internal/v1/research:
    post:
      operationId: decideResearchSource
      summary: Produce a non-authoritative, traceable research-source decision
      description: >-
        Backend supplies the authoritative ExecutionContext. GENESIS may request
        Backend-governed external retrieval but cannot execute HTTP, add tools, or
        expand scope and permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/research/research-analysis-request.schema.json
      responses:
        "200":
          description: Canonical research decision
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/research-decision.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/research/run:
    post:
      operationId: runEvidenceBoundResearch
      summary: Analyze a canonical Backend-issued research request
      description: >-
        Backend supplies the complete authorized context and canonical evidence.
        GENESIS returns non-authoritative findings and recommendations; Backend
        remains responsible for persistence and backlog governance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/research/research-request.schema.json
      responses:
        "200":
          description: Canonical evidence-bound research result
          content:
            application/json:
              schema:
                $ref: ../../schemas/research/research-result.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/factory/analyze:
    post:
      operationId: analyzeInternalFactoryRequirement
      summary: Produce a non-authoritative capability or agent proposal
      description: >-
        ALOS Backend supplies canonical ExecutionContext and an authoritative read-only
        capability catalog. GENESIS returns REUSE references or CREATE drafts without
        registering, approving, activating, or releasing them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/factory/factory-analysis-request.schema.json
      responses:
        "200":
          description: Non-authoritative Factory analysis result
          content:
            application/json:
              schema:
                $ref: ../../schemas/factory/factory-analysis-result.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/system/integration:
    get:
      operationId: getGenesisIntegrationDiagnostic
      summary: Verify the internal GENESIS control-plane boundary
      responses:
        "200":
          description: GENESIS is reachable without a model provider or business database
          content:
            application/json:
              schema:
                $ref: ../../schemas/common/integration-diagnostic.schema.json#/$defs/genesis_response
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/agent-runs:
    post:
      operationId: submitInternalAgentRun
      summary: Submit a validated run from ALOS Backend to GENESIS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/runtime/agent-runtime-invocation.schema.json
      responses:
        "200":
          description: Canonical terminal result from the bounded GENESIS runtime
          content:
            application/json:
              schema:
                $ref: ../../schemas/agent/agent-run-result.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/reviews:
    post:
      operationId: assembleInternalReviewPackage
      summary: Produce deterministic assurance and an advisory review package
      description: >-
        Backend supplies the authoritative subject snapshot and evidence. GENESIS
        returns advisory assurance material only and cannot approve, release, or
        activate the subject.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/review/review-invocation.schema.json
      responses:
        "200":
          description: Canonical advisory ReviewPackage
          content:
            application/json:
              schema:
                $ref: ../../schemas/review/review-package.schema.json
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/agent-runs/{run_id}:
    parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: ../../schemas/common/identifiers.schema.json#/$defs/run_id
    get:
      operationId: getInternalAgentRun
      summary: Read control-plane run state from ALOS Backend
      responses:
        "200":
          description: Run state
          content:
            application/json:
              schema:
                $ref: ../../schemas/agent/agent-run-result.schema.json
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /internal/v1/tool-requests:
    post:
      operationId: requestBackendToolExecution
      summary: Request a business action from the Backend ToolExecutor
      description: This callback is implemented by ALOS Backend, not by an agent.
      servers:
        - url: https://alos-backend.internal.example.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../schemas/tool/tool-request.schema.json
      responses:
        "200":
          description: Structured ToolResult for success, denial, rejection, failure, or timeout
          content:
            application/json:
              schema:
                $ref: ../../schemas/tool/tool-result.schema.json
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    serviceAuth:
      type: http
      scheme: bearer
  responses:
    ErrorResponse:
      description: Contract error
      content:
        application/json:
          schema:
            $ref: ../../schemas/common/error.schema.json

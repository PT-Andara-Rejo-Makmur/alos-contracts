name: Contract quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate JSON Schemas
        run: python scripts/validate_schemas.py

      - name: Validate OpenAPI
        run: python scripts/validate_openapi.py

      - name: Validate examples
        run: python scripts/check_examples.py

      - name: Verify generated TypeScript
        run: python scripts/generate_typescript.py --check

      - name: Detect breaking changes against pull request base
        if: github.event_name == 'pull_request'
        run: python scripts/check_compatibility.py --baseline-ref "${{ github.event.pull_request.base.sha }}"

      - name: Detect breaking changes against previous main revision
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_compatibility.py --baseline-ref "${{ github.event.before }}"

      - name: Run tests
        run: python -m pytest
